<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tours 360 — Preview</title>

  <link rel="icon" href="/preview/favicon.png" type="image/png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core/index.css" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #viewer {
      width: 100%;
      height: 100%;
    }

    /* Ocultar todos los controles de PSV */
    .psv-navbar,
    .psv-loader,
    .psv-canvas-container .psv-overlay {
      display: none !important;
    }

    /* Logo flotante */
    #logo-overlay {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 100;
      pointer-events: none;
      animation: respirar 3.5s ease-in-out infinite;
    }

    #logo-overlay img {
      width: 320px;
      max-width: 80vw;
      filter: drop-shadow(0 4px 24px rgba(0, 0, 0, 0.7))
              drop-shadow(0 2px 8px rgba(0, 0, 0, 0.5));
    }

    @keyframes respirar {
      0%   { transform: translate(-50%, -50%) scale(1);    opacity: 0.92; }
      50%  { transform: translate(-50%, -50%) scale(1.04); opacity: 1;    }
      100% { transform: translate(-50%, -50%) scale(1);    opacity: 0.92; }
    }
    #icon-hint {
      position: fixed;
      bottom: 24px;
      left: 48px;
      z-index: 100;
      pointer-events: none;
      animation: flotar 2.5s ease-in-out infinite;
    }

    #icon-hint img {
      width: 64px;
      height: 64px;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.6));
      opacity: 0.4;
    }

    @keyframes flotar {
      0%   { transform: translateY(0px);   opacity: 0.4; }
      50%  { transform: translateY(-6px);  opacity: 0.55; }
      100% { transform: translateY(0px);   opacity: 0.4; }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three/build/three.module.js",
        "@photo-sphere-viewer/core": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core/index.module.js",
        "@photo-sphere-viewer/autorotate-plugin": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/autorotate-plugin/index.module.js"
      }
    }
  </script>
</head>
<body>

  <div id="viewer"></div>

  <div id="logo-overlay">
    <img src="/preview/logo.png" alt="Tours 360" />
  </div>

  <div id="icon-hint">
    <img src="/preview/icon.png" alt="Mueve la imagen" />
  </div>

  <script type="module">
    import { Viewer } from '@photo-sphere-viewer/core';
    import { AutorotatePlugin } from '@photo-sphere-viewer/autorotate-plugin';

    try {
      const viewer = new Viewer({
        container: document.getElementById('viewer'),
        panorama: '/preview/glamping.jpg',
        defaultYaw: 0,
        defaultPitch: 0,
        defaultZoomLvl: 50,
        plugins: [
          [AutorotatePlugin, {
            autostartDelay: 0,
            autorotatePitch: 0,
            autorotateSpeed: '0.5rpm',
          }],
        ],
        navbar: false,
        loadingImg: null,
        touchmoveTwoFingers: false,
        mousewheelCtrlKey: false,
      });

      viewer.addEventListener('error', (e) => {
        console.error('PSV error:', e);
        document.body.style.background = 'red'; // debug visual
      });

    } catch (err) {
      console.error('Init error:', err);
    }
  </script>

</body>
</html>
